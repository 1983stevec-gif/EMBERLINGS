function depositVault(id,index=vaultData().slots.findIndex(s=>!s.creatureId)){const c=state.owned.find(c=>c.id===id),v=vaultData();if(!c?.fused){toast('Only fused Mythlings can work in the Vault.');return false}if(c.id===getCreature().id||vaulted(c)||tradeLocked(c)){toast('Choose a spare fused Mythling. Active and stored partners are protected.');return false}if(!Number.isInteger(index)||index<0||index>=v.unlocked||v.slots[index].creatureId)return false;return economyTransaction(()=>{settleVault();Object.assign(v.slots[index],{creatureId:id,lastAt:vaultClock()})})}

let rollAnimation=null,rollFinish=null;
function startPackRoll(p,c){const landing=26,cards=Array.from({length:32},(_,i)=>({kind:i<p.kinds.length?p.kinds[i]:p.kinds[Math.floor(Math.random()*p.kinds.length)]}));cards[landing]=c;view='packOpening';frame(`<button class="back" data-go="packs">‹ Packs · your purchase is saved</button><section class="panel center rollPanel"><h1>${p.icon} ${p.name}</h1><p id="rollStatus" role="status">Rolling Mythling ${Math.min((pendingPackData()?.revealed||0)+1,packCreatures().length)} / ${packCreatures().length}…</p><div class="rollWindow"><div class="rollMarker" aria-label="Winning Mythling marker">▼</div><div class="rollTrack" id="rollTrack">${cards.map((item,i)=>`<div class="rollCard ${i===landing&&c.shiny?'rollShiny':''}" data-roll-index="${i}"><span>${mythlingPortrait(item)}</span><strong>${species[item.kind].name}</strong><small>${i===landing?rarityLabel(c):p.rarity}${i===landing&&c.shiny?' · Shiny':''}</small></div>`).join('')}</div><div class="rollLine"></div></div><button class="button gold" id="skipOpening">Stop & Reveal</button> <button class="button" id="rollRevealAll">Reveal All Mythlings</button><h3>Possible Mythlings in this pack</h3><div class="rollPool">${p.kinds.map(k=>`<span>${mythlingPortrait({kind:k})} ${species[k].name}</span>`).join('')}</div><p class="small muted">The Mythling under the centre marker is yours. One roll, one saved result.</p></section>`);const track=$('#rollTrack'),end=-(landing*140+64);let finished=false;rollFinish=()=>{if(finished||view!=='packOpening')return;finished=true;if(rollAnimation)rollAnimation.cancel();rollAnimation=null;track.style.transform=`translateX(${end}px)`;const winner=track.querySelector(`[data-roll-index="${landing}"]`);winner?.classList.add('rollWinner');winner?.setAttribute('data-winner',c.id);arenaText('#rollStatus','Landed on '+meta(c).name+'!');$('#skipOpening').disabled=true;packTimer=setTimeout(()=>{if(view==='packOpening')revealPack(c)},650)};$('#skipOpening').onclick=()=>rollFinish?.();$('#rollRevealAll'). function castMythlingSkill(a,c,dx,dy,base){const p=a.player,m=moveProfile(c.kind),alive=a.foes.filter(f=>f.hp>0),nearest=alive.sort((f,g)=>distance(p,f)-distance(p,g))[0];a.energy-=25;a.cool.skill=m.cool;a.effects.push({x:p.x,y:p.y,r:m.range||60,life:.35,color:m.color});arenaMessage(a,m.skill+'!');
 if(m.count){a.shots.push(...skillShots(p,c.kind,base,dx,dy));return}
 if(m.mode==='lunge'){for(let i=0;i<8;i++)moveActor(a,p,dx*6,dy*6);if(nearest&&distance(p,nearest)<m.range)hurtFoe(a,nearest,Math.round(base*m.power));return}
 if(m.mode==='bloom'){for(const f of alive)if(distance(p,f)<m.range)hurtFoe(a,f,Math.round(base*m.power));p.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*.1));return}
 if(m.mode==='chain'){if(nearest&&distance(p,nearest)<m.range){hurtFoe(a,nearest,Math.round(base*m.power));for(const f of alive)if(f!==nearest&&distance(f,nearest)<140)hurtFoe(a,f,Math.round(base*m.power*.7));}return}
 if(m.mode==='siphon'){if(nearest&&distance(p,nearest)<m.range){hurtFoe(a,nearest,Math.round(base*m.power));p.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*.08));a.energy=Math.min(100,a.energy+10)}return}

function openPocketDeck(){view='decks';if(state.cardBattle||state.cardOnlineId)return frame(`<button class="back" data-go="home">‹ Home</button><h1>Battle Deck</h1><p>Finish or leave your current battle before changing its deck.</p><button class="button" data-go="home">Home</button>`);const pool=ownedBattlePool(),templates=deckTemplates(pool);if(!pool.length)return frame('<h1>Battle Deck</h1><p>Take a Mythling out of the Vault or finish its trade first.</p><button class="button" data-go="home">Home</button>');if(!pocketDeckKeys){try{pocketDeckKeys=state.pocketDeck?.keys?[...state.pocketDeck.keys]:buildBattleDeck(pool).map(c=>c.cardType==='trainer'?'t-'+c.trainer:c.template)}catch{pocketDeckKeys=[]}}if(!pocketDeckEnergy)pocketDeckEnergy=state.pocketDeck?.energyTypes?[...state.pocketDeck.energyTypes]:[];const count=k=>pocketDeckKeys.filter(v=>v===k).length;let error='';try{buildBattleDeck(pool,pocketDeckKeys)}catch(e){error=e.message}frame(`<button class="back" data-go="home">‹ Home</button><section class="hero"><span class="pill">DECK BUILDER · MAX 20</span><h1>Your Battle Deck</h1><p>Use 1–20 cards and include a Basic Mythling. Mythling copies are limited to two and by your collection; Trainers have a two-copy limit. Trainers come from your reusable starter toolkit. Evolution cards are battle forms of species you own; they never consume or duplicate Inventory creatures.</p><strong>${pocketDeckKeys.length}/20 cards</strong><p id="deckError">${error||'Legal deck · ready to battle'}</p><button class="button" id="autoDeck">Auto-build</button> <button class="button gold" id="savePocketDeck" ${error?'disabled':''}>Save Deck</button> <button class="button alt" data-go="rules">Battle Rules</button></section><section class="panel"><h2>Merfling Zone · choose up to three types</h2><p>Leave all unchecked to choose automatically from your deck. Ending your turn earns one of these types for your next turn.</p><div class="energyChoices">${[...new Set(ELEMENTS)].map(e=>`<label><inp function pocketRules(){view='rules';frame(`<button class="back" data-go="home">‹ Home</button><h1>Battle Rules</h1><section class="panel"><h2>Prepare a deck</h2><p>Build 1–20 cards, with at least one Basic Mythling. You may add up to two owned copies of each Mythling card; Trainers are limited to two per name. Draw up to five to start; your opening hand contains a Basic. A fair automatic coin flip chooses who goes first. Choose an Active Mythling and place up to three Basics on your Bench, then Ready.</p><h2>Your turn</h2><p>Draw one card. Both players start without Merfling. Ending your turn earns one Merfling for your next turn. Attach it to any of your Mythlings in play, once per turn. An attack also ends the turn and earns your next Merfling. Unused Merfling is replaced by the new one; it does not pile up. Merfling stays attached after attacking unless an effect or retreat discards it. Typed attacks need their matching Merfling plus enough total Merfling; neutral costs accept any type.</p><p>Play Basics to your Bench, Items, one Supporter per turn, and one Tool per Mythling. One Stadium can be in play. Evolve a matching previous Stage from hand after your first turn; a Mythling cannot evolve on the turn it entered play or already evolved. Damage and Merfling remain through evolution; Special Conditions clear.</p><h2>Attack or retreat</h2><p>Only the Active Mythling attacks. An attack ends your turn. You can also End Turn without attacking. You may retreat once per turn: discard its retreat cost in attached Merfling and switch with a Benched Mythling. Retreat does not end your turn and clears Special Conditions. No focus meter, universal Guard action, ultimate charge, attack cooldown, percentage resistance, or artificial one-shot damage cap.</p><h2>Knockouts and points</h2><p>Weakness adds 20 damage to attacks against the Active Mythling. No resistance. Benched damage ignores Weakness. Normal Mythlings give 1 point; cards marked Radiant give 2. Knocked-out cards and their attachments go to the match discard pile. Promote a Benched Mythling after an Active knockout. If no Mythlings remain in play, you lose even if your hand or deck has more.</p><p>First to 3 points wins. Drawing from an empty deck does not lose the battle. A 30-turn game ends in a draw. Each player has a 20-minute battle clock and 90 seconds for a turn or replacement; an expired turn ends automatically. No five-minute score win or sudden death. Your owned cards always return after the match.</p><h2>Special Conditions</h2><p>Poison deals 10 between turns. Burn deals 20, then a coin may cure it. Sleep uses a coin between turns to wake. Paralysis stops attacking and retreating until that player’s turn ends. Confusion uses a coin before attacking; tails deals 30 to the attacker instead. Sleep, Paralysis and Confusion replace each other; Poison and Burn can coexist with them.</p><p class="muted small">Pocket-style core format with original Emberlings cards, stats, elements and effects. Radiant is Emberlings’ two-point card designation. Co-op remains a shared-deck extension; Pocket itself is a duel game.</p><button class="button gold" data-go="decks">Build Deck</button> <button class="button" data-go="map">Adventure</button></section>`)}
