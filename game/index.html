function positionLevel(i){let r=regionsFor(i),n=i-regions[r][1];return {x:(r===0?80:r===1?495:r===2?845:r===3?1270:1510)+(n%5)*54+Math.floor(n/5)*16,y:(r===0?485:r===1?205:r===2?600:r===3?200:695)+(Math.sin(n*1.8)*85)+Math.floor(n/5)*34}}function setupMap(){

role="status">${tradeLocked(c)?'Finish or decline this Mythling’s trade before mutating.':transformed?'✦ Transformation complete! Your permanent trait is saved.':c.mutation===m.id?m.name+' is already active.':state.coins<m.cost?(m.cost-state.coins).toLocaleString()+' more coins needed':current?'Replacing '+current.name+' requires confirmation.':'Choose a trait, then mutate.'}</p><div id="mutationConfirm"></div></section><section><h2>Available mutations</h2><div class="mutationOptions">${MUTATIONS.map(x=>`<button class="panel mutationOption ${x.id===m.id?'selected':''}" data-mutation="${x.id}" aria-pressed="${x.id===m.id}" style="--mutation-color:${x.color}"><strong>${x.icon} ${x.name}</strong><span>+${x.damage*100}% damage · ${Number((1+Math.log10(1+x.coins)*.5).toFixed(2))}× Vault coins</span><span>Damage ${petAttack({...c,mutation:x.id})} · Vault ${Number(vaultRate({...c,mutation:x.id}).toFixed(4))}/sec</span><b>🪙 ${x.cost.toLocaleString()}</b></button>`).join('')}</div><p class="small muted">A new trait replaces the old one; bonuses do not stack. Mutations are purchased here, never counted as pack creatures.</p></section></div><h2>Choose your Mythling</h2><p class="small muted">Showing ${page*24+1}–${Math.min(state.owned.length,(page+1)*24)} of ${state.owned.length} Mythlings</p><div class="grid mutationCollection">${state.owned.slice(page*24,(page+1)*24).map(p=>`<button class="panel owned ${p.id===c.id?'mutationSelected':''}" data-mutate-pet="${p.id}"><div class="creature mini">${meta(p).emoji}</div><strong>${meta(p).name}</strong><p>Lv.${p.level} · ${rarityLabel(p)}${vaulted(p)?' · In Vault':''}</p>${mutationBadge(p)}</button>`).join('')}</div>${state.owned.length>24?`<p><button class="button" id="mutationPrev" ${page===0?'disabled':''}>Previous Mythlings</button> <button class="button" id="mutationNext" ${(page+1)*24>=state.owned.length?'disabled':''}>Next Mythlings</button></p>`:''}`);

function recommendedPack(level=limit()){return packCatalog[level<=10?0:level<=25?1:level<=45?2:level<=70?3:level<100?4:5]}

const VAULT_SLOT_COSTS=[0,2500,10000,35000,100000];
function vaultData(){let v=state.vault;if(!v||v.version!==2){v={version:2,unlocked:1,slots:[{creatureId:v?.creatureId||null,pending:Math.max(0,Number(v?.pending)||0),lastAt:Number(v?.lastAt)||Date.now()}]};state.vault=v}return v}
function vaulted(c){return !!c&&vaultData().slots.some(s=>s.creatureId===c.id)}
function vaultPet(index=0){return state.owned.find(c=>c.id===vaultData().slots[index]?.creatureId)||null}
function vaultRate(c){return balancedVaultRate(c,coinMultiplier())}
function vaultSlotBalance(index,now=vaultClock()){const s=vaultData().slots[index];if(!s)return 0;return vaultAccrual(s.pending,s.lastAt??now,now,vaultRate(vaultPet(index)))}
function vaultClaimable(now=vaultClock()){return vaultData().slots.reduce((sum,_,i)=>sum+Math.floor(vaultSlotBalance(i,now)),0)}
function vaultBalance(now=vaultClock()){return vaultData().slots.reduce((sum,_,i)=>sum+vaultSlotBalance(i,now),0)}
function settleVault(now=vaultClock()){vaultData().slots.forEach((s,i)=>{s.pending=vaultSlotBalance(i,now);s.lastAt=Math.max(Number(s.lastAt)||0,now)})}
function depositVault(id,index=vaultData().slots.findIndex(s=>!s.creatureId)){const c=state.owned.find(c=>c.id===id),v=vaultData();if(!c?.fused){toast('Only fused Mythlings can work in the Vault.');return false}if(c.id===getCreature().id||vaulted(c)||tradeLocked(c)){toast('Choose a spare fused Mythling. Active and stored partners are protected.');return false}if(!Number.isInteger(index)||index<0||index>=v.unlocked||v.slots[index].creatureId)return false;return economyTransaction(()=>{settleVault();Object.assign(v.slots[index],{creatureId:id,lastAt:vaultClock()})})}
function claimVault(index=null){const v=vaultData();if(index!==null&&(!Number.isInteger(index)||index<0||index>=v.unlocked))return 0;let amount=0;const success=economyTransaction(()=>{settleVault();v.slots.forEach((s,i)=>{if(index===null||i===index){const coins=Math.floor(s.pending);amount+=coins;s.pending-=coins}});state.coins+=amount});return success?amount:0}
function withdrawVault(index=0){if(!vaultPet(index))return false;return economyTransaction(()=>{settleVault();const s=vaultData().slots[index],amount=Math.floor(s.pending);state.coins+=amount;s.pending-=amount;s.creatureId=null;s.lastAt=vaultClock()})}
function buyVaultSlot(expectedUnlocked){const v=vaultData();if(expectedUnlocked!==v.unlocked||v.unlocked>=5||state.coins<VAULT_SLOT_COSTS[v.unlocked])return false;return economyTransaction(()=>{state.coins-=VAULT_SLOT_COSTS[v.unlocked];v.slots.push({creatureId:null,pending:0,lastAt:vaultClock()});v.unlocked++})}
function fusion(){return fusionHub()}

><h2>Choose a fused Mythling</h2><p>Earn coins in this slot every second.</p><p>Saved earnings: <strong data-vault-balance="${i}">${Math.floor(vaultSlotBalance(i,snapshotAt))}</strong> 🪙</p><label for="vaultChoice${i}">Mythling for Slot ${i+1}</label><select id="vaultChoice${i}"><option value="">Choose a Mythling</option>${eligible.map(c=>`<option value="${c.id}">${meta(c).name} · ${rarityLabel(c)} · Lv.${c.level} · +${Number(vaultRate(c).toFixed(4))}/sec</option>`).join('')}</select><button class="button gold" data-deposit-slot="${i}" ${eligible.length?'':'disabled'}>Put in Slot ${i+1}</button>`}</section>`}).join('')}</div><section class="panel"><h2>Balanced passive earnings</h2><div class="vaultRates">${RARITIES.map((r,i)=>`<div><span>${r}</span><strong>+${[.001,.0016,.0025,.0035,.005,.0065,.008][i]}</strong></div>`).join('')}</div><p class="small muted">Rates scale gently with level and rarity. Rebirth adds up to 2× and mutations up to 2.5× to passive income. Shiny adds 10%. Server time limits clock exploits. Offline earnings cap at 2 hours. Battles and quests are the main coin source. Take Out collects whole coins from that slot; fractions stay safe. Stored Mythlings cannot battle, train or fuse until taken out.</p></section><p><button class="button" data-go="fuse">Fuse Mythlings</button></p><details class="panel section"><summary>Have a fused Mythling from an older update?</summary><p>Only mark a Mythling here if you previously created it in the Fusion Lab.</p><div class="legacyChoices">${state.owned.filter(c=>!c.fused&&c.id!=='starter').map(c=>`<button class="button alt" data-legacy-fusion="${c.id}">Mark ${meta(c).name} as a past fusion</button>`).join('')||'No older unlabeled Mythlings.'}</div><div id="legacyFusionPrompt"></div></details>`);
 const collected=amount=>{vault();$('#vaultClaimStatus').textContent=amount?`Collected ${amount.toLocaleString()} coins!`:'Your Mythlings are still earning.'};$('#vaultCollectAll').onclick=()=>collected(claimVault());

 document.querySelectorAll('[data-legacy-fusion]').forEach(b=>b.onclick=()=>{const id=b.dataset.legacyFusion,c=state.owned.find(c=>c.id===id);$('#legacyFusionPrompt').innerHTML=`<div class="notice">Did you previously fuse ${meta(c).name}? <button class="button" id="confirmLegacy">Yes, I fused it</button></div>`;$('#confirmLegacy').onclick=()=>{markPastFusion(id);vault()}});

let rollAnimation=null,rollFinish=null;
function startPackRoll(p,c){const landing=26,cards=Array.from({length:32},(_,i)=>({kind:i<p.kinds.length?p.kinds[i]:p.kinds[Math.floor(Math.random()*p.kinds.length)]}));cards[landing]=c;view='packOpening';frame(`<button class="back" data-go="packs">‹ Packs · your purchase is saved</button><section class="panel center rollPanel"><h1>${p.icon} ${p.name}</h1><p id="rollStatus" role="status">Rolling Mythling ${Math.min((pendingPackData()?.revealed||0)+1,packCreatures().length)} / ${packCreatures().length}…</p><div class="rollWindow"><div class="rollMarker" aria-label="Winning Mythling marker">▼</div><div class="rollTrack" id="rollTrack">${cards.map((item,i)=>`<div class="rollCard ${i===landing&&c.shiny?'rollShiny':''}" data-roll-index="${i}"><span>${species[item.kind].emoji}</span><strong>${species[item.kind].name}</strong><small>${i===landing?rarityLabel(c):p.rarity}${i===landing&&c.shiny?' · Shiny':''}</small></div>`).join('')}</div><div class="rollLine"></div></div><button class="button gold" id="skipOpening">Stop & Reveal</button> <button class="button" id="rollRevealAll">Reveal All Mythlings</button><h3>Possible Mythlings in this pack</h3><div class="rollPool">${p.kinds.map(k=>`<span>${species[k].emoji} ${species[k].name}</span>`).join('')}</div><p class="small muted">The Mythling under the centre marker is yours. One roll, one saved result.</p></section>`);const track=$('#rollTrack'),end=-(landing*140+64);let finished=false;rollFinish=()=>{if(finished||view!=='packOpening')return;finished=true;if(rollAnimation)rollAnimation.cancel();rollAnimation=null;track.style.transform=`translateX(${end}px)`;const winner=track.querySelector(`[data-roll-index="${landing}"]`);winner?.classList.add('rollWinner');winner?.setAttribute('data-winner',c.id);arenaText('#rollStatus','Landed on '+meta(c).name+'!');$('#skipOpening').disabled=true;packTimer=setTimeout(()=>{if(view==='packOpening')revealPack(c)},650)};$('#skipOpening').onclick=()=>rollFinish?.();$('#rollRevealAll').onclick=()=>revealAllPack();const reduced=state.reducedMotion||typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduced&&track.animate){rollAnimation=track.animate([{transform:'translateX(-64px)'},{transform:`translateX(${end}px)`}],{duration:2600,easing:'cubic-bezier(.12,.72,.12,1)',fill:'forwards'});rollAnimation.finished.then(()=>rollFinish?.()).catch(()=>{})}else rollFinish();}

function castMythlingSkill(a,c,dx,dy,base){const p=a.player,m=moveProfile(c.kind),alive=a.foes.filter(f=>f.hp>0),nearest=alive.sort((f,g)=>distance(p,f)-distance(p,g))[0];a.energy-=25;a.cool.skill=m.cool;a.effects.push({x:p.x,y:p.y,r:m.range||60,life:.35,color:m.color});arenaMessage(a,m.skill+'!');
 if(m.count){a.shots.push(...skillShots(p,c.kind,base,dx,dy));return}
 if(m.mode==='lunge'){for(let i=0;i<8;i++)moveActor(a,p,dx*6,dy*6);if(nearest&&distance(p,nearest)<m.range)hurtFoe(a,nearest,Math.round(base*m.power));return}
 if(m.mode==='bloom'){for(const f of alive)if(distance(p,f)<m.range)hurtFoe(a,f,Math.round(base*m.power));p.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*.1));return}
 if(m.mode==='chain'){if(nearest&&distance(p,nearest)<m.range){hurtFoe(a,nearest,Math.round(base*m.power));for(const f of alive)if(f!==nearest&&distance(f,nearest)<140)hurtFoe(a,f,Math.round(base*m.power*.7));}return}
 if(m.mode==='siphon'){if(nearest&&distance(p,nearest)<m.range){hurtFoe(a,nearest,Math.round(base*m.power));p.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*.08));a.energy=Math.min(100,a.energy+10)}return}

let shopCategory='Packs';shop=function(){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h1>Arcane Market</h1><p>Earn it in Emberlings. Every item uses game coins.</p><div class="shopCategories">${['Packs','Themed packs',...new Set(SHOP_ITEMS.map(i=>i.category))].map(c=>`<button class="button ${shopCategory===c?'gold':'alt'}" data-shop-category="${c}">${c}</button>`).join('')}</div><div class="grid">${shopCategory==='Packs'||shopCategory==='Themed packs'?packCatalog.filter((p,i)=>shopCategory==='Packs'||i>=2).map(p=>`<section class="panel"><h2>${p.icon} ${p.name}</h2><p>Five ${p.rarity} cards · ${p.kinds.map(k=>species[k].name).join(', ')}</p><p>Shiny ${p.shiny*100}% · Secret ${p.secret*100}% each</p><button class="button gold" data-shop-pack="${p.id}" ${state.coins<p.cost?'disabled':''}>${p.cost} coins · Open Pack</button></section>`).join(''):SHOP_ITEMS.filter(i=>i.category===shopCategory).map(i=>{const owned=state.cosmetics.owned.includes(i.id);return `<section class="panel"><div class="shopEmblem">${({cover:'📕',sleeve:'🎴',effect:'✧',pass:'🎟',xp:'📜',profile:'🏷',collectible:'☀'})[i.type]}</div><h2>${i.name}</h2><p>${i.description}</p><strong>${i.cost} coins</strong><p><button class="button gold" data-shop-item="${i.id}" ${!owned&&state.coins<i.cost?'disabled':''}>${owned?i.type==='collectible'?'Owned':'Equip':'Purchase'}</button></p>${i.type==='pass'?'<p>'+state.items.trainingPasses+' passes owned</p>':''}</section>`}).join('')}</div><p id="shopStatus" role="status"></p>`);document.querySelectorAll('[data-shop-category]').forEach(b=>b.onclick=()=>{shopCategory=b.dataset.shopCategory;shop()});document.querySelectorAll('[data-shop-pack]').forEach(b=>b.onclick=()=>openPack(b.dataset.shopPack));document.querySelectorAll('[data-shop-item]').forEach(b=>b.onclick=()=>{const item=SHOP_ITEMS.find(i=>i.id===b.dataset.shopItem);if(state.cosmetics.owned.includes(item.id)){if(item.type!=='collectible'&&economyTransaction(()=>state.cosmetics[item.type]=item.v const PRACTICES=[{id:'attack',name:'Attack Academy',sub:'Choose effective attacks with the focus available.'},{id:'element',name:'Element Challenge',sub:'Match each opponent with its elemental counter.'},{id:'survival',name:'Survival Trial',sub:'Read incoming attacks and use guard to survive.'},{id:'combo',name:'Combo Workshop',sub:'Build focus and connect a five-rune combination.'},{id:'speed',name:'Speed Strategy',sub:'Choose the right elemental counter in ten seconds.'}];
training=function(){view='training';const center=PRACTICES[Math.floor(randomUnit()*PRACTICES.length)];practiceSession={center,cardId:getCreature().id,round:0,score:0,health:100,stage:'pick',focus:1};renderPractice()};
function practiceQuestion(p){const center=p.center.id,targetKind=Math.floor(randomUnit()*10),target=ELEMENTS[targetKind];if(center==='element'||center==='speed'){const answer=Object.keys(ADVANTAGE).find(k=>ADVANTAGE[k]===target);const options=shuffled([answer,...shuffled([...new Set(ELEMENTS)].filter(e=>e!==answer)).slice(0,3)]);return {text:'A '+target+' Mythling blocks your path. Which element has the advantage?',options,correct:options.indexOf(answer),explain:answer+' is strong against '+target}}if(center==='combo'){const sequence=['Rune Guard','Basic attack','Ultimate','Basic attack','Signature skill'],correct=sequence[p.round];return {text:['Build focus while protecting your card.','Add one focus with a steady strike.','Spend three focus on a powerful attack.','Refill focus after your ultimate.','Finish with your signature ability.'][p.round],options:sequence.slice(0,3).concat('Signature skill'),correct:correct==='Rune Guard'?0:correct==='Basic attack'?1:correct==='Ultimate'?2:3,explain:correct+' connects this part of the combo.'}}if(center==='survival'){const charged=p.round%2===0;return {text:charged?'The opponent charges a 60-damage attack. Protect your remaining HP.':'The opponent is recovering. Build focus for your next strike.',options:['Basic attack','Rune Guard','Wait without guarding'],correct:charged?1:0,explain:charged?'Guard reduces the next incoming attack by 55%.':'Basic attacks build focus while dealing damage.',incoming:charged?60:10}}const c=state.owned.find(c=>c.id===p.cardId),card={...c,...cardStats(c),energy:p.round%2?3:0,shield:0,cool:0},foe={...cardStats({kind:targetKind,level:1}),shield:0};const moves=attacks(card).filter(m=>m.id!=='guard');const scores=moves.map(m=>m.cost<=card.energy?damageFor(card,foe,m):-1),max=Math.max(...scores);return {text:'You have '+card.energy+' focus. Choose the strongest affordable attack against '+foe.element+'.',options:moves.map(m=>m.name+' · '+m.cost+' focus · '+damageFor(card,foe,m)+' damage'),correct:scores.indexOf(max),explain:'Check focus costs and elemental damage before attacking.'}}
function renderPractice(){const p=practiceSession;if(!p||view!=='training')return;clearInterval(cardTimer);const c=state.owned.find(c=>c.id===p.cardId)||getCreature();if(p.stage==='pick'){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><section class="hero"><span class="pill">RANDOM TRAINING CENTER</span><h1>${p.center.name}</h1><p>${p.center.sub}</p><p>Five challenges. Score at least 3 for EXP. Five rewarded sessions per UTC day, then use an Academy Pass. Attack growth caps at +5 per Mythling. ${state.items.trainingPasses||0} Academy Passes available.</p></section><h2>Choose a Mythling to train</h2><div class="grid">${state.owned.filter(c=>!vaulted(c)&&!tradeLocked(c)).map(c=>`<button class="panel" data-practice-pet="${c.id}">${collectibleCard(c)}</button>`).join('')}</div><p><button class="button" data-go="training">Try Another Random Center</button> <button class="button alt" data-go="hollow">Explore Hidden Hollow</button></p>`);document.querySelectorAll('[data-practice-pet]').forEach(b=>b.onclick=()=>{p.cardId=b.dataset.practicePet;p.stage='play';p.question=practiceQuestion(p);renderPractice()});paintStaticPortraits('training');return}if(p.stage==='done'){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><section class="hero center"><h1>${p.center.name} Complete</h1><h2>${p.score}/5 correct</h2><p>${p.health} simulated HP remaining</p><p>+${p.reward?.xp||0} EXP · +${p.reward?.attack||0} attack progression</p><p>${p.reward?.xp?'Saved to '+meta(c).name+'.':p.score<3?'Score 3 or more to earn rewards.':'Daily reward cap reached. An Academy Pass grants another rewarded session.'}</p><button class="button gold" data-go="training">Try Another Random Session</button><button class="button" data-go="home">Home</button></section>`);return}const q=p.question;frame(`<button class="back" data-go="home">‹ Adventure HQ</button><section class="hero"><span class="pill">${p.center.name} · CHALLENGE ${p.round+1}/5</span><h1>${meta(c).name}’s Card Practice</h1><p>Score ${p.score} · Simulated HP ${p.health}</p>${p.center.id==='speed'?'<strong id="practiceTime">10s</strong>':''}<h2>${q.text}</h2><div class="practiceOptions">${q.options.map((o,i)=>`<button class="button" data-practice-answer="${i}">${o}</button>`).join('')}</div><p id="practiceFeedback" role="status"></p><button class="button gold hide" id="practiceNext">Next Challenge</button></section>`);p.answered=false;p.deadline=Date.now()+10000;document.querySelectorAll('[data-practice-answer]').forEach(b=>b.onclick=()=>answerPractice(+b.dataset.practiceAnswer));if(p.center.id==='speed')cardTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((p.deadline-Date.now())/1000));arenaText('#practiceTime',left+'s');if(!left)answerPractice(-1)},250)}
function answerPractice(answer){const p=practiceSession;if(!p||p.answered||view!=='training')return;p.answered=true;clearInterval(cardTimer);const correct=answer===p.question.correct;if(correct)p.score++;if(p.center.id==='survival')p.health=Math.max(0,p.health-Math.round(p.question.incoming*(correct&&answer===1?.45:1)));$('#practiceFeedback').textContent=(correct?'Correct! ':'Try this: ')+p.question.explain;document.querySelectorAll('[data-practice-answer]').forEach(b=>b.disabled=true);$('#practiceNext').classList.remove('hide');$('#practiceNext').onclick=()=>{if(++p.round>=5){const c=state.owned.find(c=>c.id===p.cardId);if(c&&!tradeLocked(c)&&!vaulted(c)){if(!economyTransaction(()=>{p.reward=practiceReward(state,c,p.score,vaultClock());grantXP(c,p.reward.xp)}))p.reward={xp:0,attack:0}}p.stage='done'}else p.question=practiceQuestion(p);renderPractice()}}
const tutorialSteps=[

function tutorial(){const step=Math.max(0,Math.min(12,state.tutorialStep||0)),d=tutorialSteps[step];frame(`<button class="back" data-go="home">‹ Adventure HQ</button><section class="tutorialCard panel"><span class="pill">EXPLORER’S GUIDE · ${step+1}/13</span><div class="tutorialProgress"><i style="width:${(step+1)/13*100}%"></i></div><h1>${d[0]}</h1><p>${d[1]}</p><div id="tutorialDemo">${step===0?collectibleCard(state.owned[0]):step===5?'<div class="tutorialMiniStack">'+state.owned.slice(0,5).map(c=>'<button class="tutorialPick" data-tutorial-pick="'+c.id+'">'+collectibleCard(c)+'</button>').join('')+'</div>':step===6?'<div class="flipCoin" id="tutorialCoin">☀</div><select id="tutorialSide"><option value="heads">Heads</option><option value="tails">Tails</option></select>':step===10?'<p>Fire challenges you. Pick its counter.</p><button class="button" data-tutorial-element="Water">Water</button><button class="button" data-tutorial-element="Nature">Nature</button><button class="button" data-tutorial-element="Wind">Wind</button>':''}</div><p id="tutorialFeedback" role="status"></p><button class="button gold" id="tutorialAction" ${step===5||step===10?'disabled':''}>${d[2]}</button> <button class="button alt" id="skipTutorial">Skip Tutorial</button><button class="button hide" id="tutorialNext">Continue ›</button></section>`);let acted=false;const done=text=>{acted=true;$('#tutorialFeedback').textContent=text;$('#tutorialAction').disabled=true;$('#tutorialNext').classList.remove('hide')};$('#skipTutorial').onclick=()=>{state.tutorialComplete=true;state.tutorialStep=0;save();go('home')};$('#tutorialNext').onclick=()=>{if(!acted)return;if(step===12){state.tutorialComplete=true;state.tutorialStep=0;save();go('home')}else{state.tutorialStep=step+1;save();tutorial()}};document.querySelectorAll('[data-tutorial-pick]').forEach(b=>b.onclick=()=>{state.tutorialStarter=b.dataset.tutorialPick;save();done('Starting Mythling selected. Five owned cards enter your stack.')});document.querySelectorAll('[data-tutorial-element]').forEach(b=>b.onclick=()=>{if(b.dataset.tutorialElement==='Water')done('Correct. Water attacks gain an advantage against Fire.');else $('#tutorialFeedback').textContent='Try Water. The element chart helps predict damage.'});$('#tutorialAction').onclick=()=>{if(acted)return;if(step===1){if(!state.tutorialPackGranted){const p=packCatalog[0];if(!economyTransaction(()=>{state.tutorialPackGranted=true;for(let i=0;i<5;i++)state.owned.push({id:crypto.randomUUID(),kind:p.kinds[Math.floor(randomUnit()*p.kinds.length)],level:1,xp:0,rarity:'Common',sourcePack:'tutorial'})}))return}$('#tutorialDemo').innerHTML='<div class="tutorialMiniStack">'+state.owned.slice(-5).map(c=>collectibleCard(c)).join('')+'</div>';done('Five Mythlings are saved in your real Inventory. This tutorial pack is awarded once.')}else if(step===2){$('#tutorialDemo').innerHTML=collectibleCard(state.owned.at(-1));done('Name, HP, damage, element and rarity describe this copy.')}else if(step===3){$('#tutorialDemo').innerHTML='<div class="magicalBinder pageTurn"><div class="binderPages">'+state.owned.slice(0,2).map(c=>collectibleCard(c)).join('')+'</div></div>';done('Turn pages with Previous / Next or swipe. Open Index to see discoveries.')}else if(step===4){$('#tutorialDemo').innerHTML='<div class="questPreview">Quest 1 · Ember Meadows<br>Win: +'+battleRewards(1).coins+' coins · +'+battleRewards(1).xp+' EXP</div>';done('Quest selected. Your owned collection supplies the battle stack.')}else if(step===6){const choice=$('#tutorialSide').value,coin=randomUnit()<.5?'heads':'tails';$('#tutorialCoin').classList.add('coinAnimation');$('#tutorialCoin').textContent=coin==='heads'?'☀':'☾';done(coin.toUpperCase()+'! '+(coin===choice?'You':'Opponent')+' wins this practice flip. Online flips are generated on the server.')}else if(step===7){const c=battleCard(state.owned.find(c=>c.id===state.tutorialStarter)||state.owned[0]),foe=battleCard({id:'demo',kind:2,level:1});const m=attacks(c)[0],damage=damageFor(c,foe,m);foe.hp-=damage;$('#tutorialDemo').innerHTML=collectibleCard(foe);done(m.name+' deals '+damage+' damage. A real attack ends your turn.')}else if(step===8){$('#tutorialDemo').innerHTML='<div class="scorePractice">YOU <b>1</b> : <b>0</b> OPPONENT</div><p class="knockoutDemo">Opponent’s card → discarded for this match</p>';done('You earned 1 point. Your active card keeps its remaining HP. The opponent chooses a replacement.')}else if(step===9){$('#tutorialDemo').innerHTML='<div class="rewardGrid"><strong>🪙 Coins</strong><strong>✧ EXP</strong><strong>🎁 Boss pack</strong></div>';done('Only real quest wins grant these rewards. Rewards are saved once with completion.')}else if(step===11){$('#tutorialDemo').innerHTML='<div class="questPreview">Practice Vault: 2.5 coins → collect 2 → 0.5 remains</div>';done('Collecting again gives 0 whole coins. Fractions stay in the slot.')}else if(step===12)done('You are ready. Your progress will save automatically.');else done('Your Mythlings are ready for an adventure.');paintStaticPortraits('tutorial')};paintStaticPortraits('tutorial')}
function onlinePool(){return state.owned.filter(c=>!vaulted(c)&&!batchTradeLocked(c)&&!(state.onlineCardLocks||[]).includes(c.id)&&!(state.cardBattle&&!state.cardBattle.match.result&&state.cardBattle.match.sides[0].cards.some(p=>p.sourceId===c.id))).slice(0,2000).map(c=>({...c}))}
function receiveCardMatch(reply){if(view!=='cardBattle'&&view!=='lobby')return;if(reply.status!=='active'){if(reply.state?.result){cardSession={...cardSession,...reply,match:reply.state};state.onlineCardLocks=[];delete state.cardOnlineId;save();completeCardBattle()}else if(reply.status!=='invited'){state.onlineCardLocks=[];delete state.cardOnlineId;save();go('friends')}return}cardSession={...reply,match:reply.state,local:false};state.cardOnlineId=reply.id;const localIds=new Set(state.owned.map(c=>c.id));state.onlineCardLocks=reply.state.sides[reply.side].cards.map(c=>c.sourceId).filter(id=>localIds.has(id));save();view='cardBattle';renderCardBattle();runCardClock();pollCardNetwork()}
function pollCardNetwork(){clearTimeout(cardNetTimer);if(!cardSession||cardSession.local||view!=='cardBattle'||cardSession.match.result)return;cardNetTimer=setTimeout(async()=>{if(view!=='cardBattle'||!cardSession||cardSession.local)return;if(document.hidden){pollCardNetwork();return}try{const r=await onlineApi('/cards/'+cardSession.id);if(view!=='cardBattle')return;if(r.version>=cardSession.version&&(!cardBusy||r.state?.result)){const changed=r.version!==cardSession.version;if(changed){receiveCardMatch(r);return}}}catch(e){arenaText('#cardError','Reconnecting… '+e.message)}pollCardNetwork()},1400)}
showLobby=function(match){stopSocialViews();stopArena();view='lobby';state.cardOnlineId=match.id;if(match.reservedIds)state.onlineCardLocks=match.reservedIds;save();frame(`<button class="back" data-go="friends">‹ Friends</button><section class="hero center"><h1>${match.mode==='duel'?'Friend Card Duel':'Co-op Card Quest'}</h1><h2>Waiting for your friend</h2><p>Your friend can accept in Friends. Five owned Mythlings per player are randomly drawn on the server.</p><p id="lobbyStatus">Invitation expires after three minutes.</p><button class="button alt" id="cancelInvite">Cancel Invitation</button></section>`);$('#cancelInvite').onclick=async()=>{try{await onlineApi('/cards/'+match.id+'/leave',{});state.onlineCardLocks=[];delete state.cardOnlineId;save();go('friends')}catch(e){toast(e.message)}};async function poll(){if(view!=='lobby')return;try{const r=await onlineApi('/cards/'+match.id);if(view!=='lobby')return;if(r.status==='active'){startOnlineMatch(r);return}if(r.status!=='invited'){state.onlineCardLocks=[];delete state.cardOnlineId;save();$('#lobbyStatus').textContent='Invitation '+r.status;return}}catch(e){arenaText('#lobbyStatus',e.message)}if(view==='lobby')lobbyTimer=setTimeout(poll,1600)}lobbyTimer=setTimeout(poll,1000)};

const beforeCardTradeLocked=tradeLocked;tradeLocked=function(c){return beforeCardTradeLocked(c)||!!c&&(state.onlineCardLocks||[]).includes(c.id)};

const oldTradePicker=showTradePicker;showTradePicker=function(page=0){oldTradePicker(page);document.querySelectorAll('[data-trade-creature]').forEach(b=>{const c=state.owned.find(c=>c.id===b.dataset.tradeCreature),mine=tradeView.host.id===tradeView.selfId?0:1,selected=c?.tradeAssetId===tradeView.offers[mine]?.assetId;b.classList.toggle('chosen',!!tradeView.offers[mine]?.assetId&&selected)});$('#tradePicker')?.scrollIntoView?.({behavior:state.reducedMotion?'instant':'smooth',block:'nearest'})};
const priorPortraitResolver=resolvePortraitCreature;resolvePortraitCreature=function(id){if(id?.startsWith('illustration-')){const [,kind,shiny]=id.split('-');return {kind:+kind,shiny:shiny==='true'}}return priorPortraitResolver(id)};
const priorLaunch=launchEmberlings;launchEmberlings=function(){migrateCards(state);recordDiscovery();save();syncVaultClock();setTimeout(async()=>{await bootGame();if(!state.tutorialComplete&&view==='home')go('tutorial')},350)};
window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){try{const next=JSON.parse(e.newValue);if(next.testResetVersion===3&&state.testResetVersion!==3){state=next;go('tutorial')}}catch{}}});
const previousBoot=bootGame;bootGame=async function(){await previousBoot();if(state.cardOnlineId&&view==='home'){try{const r=await onlineApi('/cards/'+state.cardOnlineId);if(r.status==='active')startOnlineMatch(r);else if(r.status==='invited')showLobby(r);else{state.onlineCardLocks=[];delete state.cardOnlineId;save()}}catch{}}};

launchEmberlings();})();
