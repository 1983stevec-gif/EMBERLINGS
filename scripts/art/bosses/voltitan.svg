    <radialGradient id="vt-eyeglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9ff0ff" stop-opacity=".95"/><stop offset="1" stop-color="#3a9cff" stop-opacity="0"/></radialGradient>
