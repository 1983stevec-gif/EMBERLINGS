    <linearGradient id="vt-shadeB" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#1a0c30" stop-opacity="0"/><stop offset="1" stop-color="#1a0c30" stop-opacity=".55"/></linearGradient>
