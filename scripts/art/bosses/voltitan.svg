      <path d="M0 0 Q7 10 14 0 M-7 5 Q0 15 7 5 M7 5 Q14 15 21 5" fill="none" stroke="#5a3008" stroke-width="1.2"/>
    </pattern>
    <mask id="vt-mask"><use href="#vt-dragon" filter="url(#to-white)"/></mask>
  </defs>

