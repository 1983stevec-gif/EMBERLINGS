    <radialGradient id="vt-flash" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d8e8ff" stop-opacity=".9"/><stop offset="1" stop-color="#6a7aff" stop-opacity="0"/></radialGradient>
