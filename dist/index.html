<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a1029"><title>Mythlings — Play</title><style>
:root{--navy:#0a1029;--panel:#18234b;--card:#202f60;--cyan:#76e8ff;--gold:#ffdd7a;--purple:#bd87ff;--white:#eff8ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--white);background:radial-gradient(circle at 50% -5%,#35317a,#0a1029 58%);min-height:100dvh;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#app{max-width:950px;margin:auto;min-height:100dvh;padding:16px 14px 105px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 16px}.brand{font-size:26px;font-weight:950;letter-spacing:2px;background:linear-gradient(110deg,#fff,#90e7ff,#d598ff);background-clip:text;color:transparent}.tag{font-size:11px;letter-spacing:2px;color:#9dacd9}.coins{background:#243363;border:1px solid #7182c3;border-radius:30px;padding:10px;font-weight:800;white-space:nowrap}h1{font-size:27px;margin:5px 0}h2{font-size:21px;margin:5px 0 15px}h3{margin:4px 0}.muted{color:#bdc8e8}.small{font-size:13px}.hero{position:relative;overflow:hidden;border:1px solid #6970c3;border-radius:24px;padding:25px;background:radial-gradient(circle at 80% 20%,#5963b9 0,transparent 30%),linear-gradient(145deg,#2a4576,#21244a 70%);min-height:190px;box-shadow:0 16px 40px #03061770}.hero:after{content:'✦  ☾  ✧';position:absolute;right:15px;top:35px;font-size:54px;color:#9aeaff77;transform:rotate(-12deg)}.hero p{max-width:380px}.button{background:linear-gradient(115deg,#2e98d6,#705dd4);border:1px solid #99c8ff;border-radius:13px;padding:12px 16px;font-weight:750;box-shadow:inset 0 1px #fff4}.button.alt{background:#29365e}.button.gold{background:linear-gradient(110deg,#ad6e24,#e4b443);color:#1d1530;border-color:#ffe7a3}.button:active,.tile:active{transform:scale(.98)}.features,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}.tile,.panel{background:linear-gradient(145deg,#253567,#131e43);border:1px solid #53639d;border-radius:20px;padding:16px;box-shadow:0 8px 20px #01061955}.tile{min-height:122px;text-align:left}.tile .emoji{font-size:35px;display:block;margin-bottom:6px}.tile strong{display:block;font-size:16px}.tile span:last-child{display:block;color:#b5c5e6;font-size:12px;margin-top:4px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0d1533f7;display:flex;justify-content:center;gap:3px;padding:9px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid #5e6baa;backdrop-filter:blur(12px)}.nav button{width:min(24%,165px);border:0;background:transparent;padding:8px 3px;border-radius:12px;font-size:12px;color:#aebbdc}.nav button.active{color:#fff;background:#31457e}.nav .ico{font-size:23px;display:block}.back{border:0;background:none;color:var(--cyan);padding:8px 0;font-weight:700}.creature{display:grid;place-content:center;text-align:center;width:95px;height:95px;margin:auto;background:radial-gradient(circle,#647dc4,#232755 70%);border:2px solid #8797d7;border-radius:50%;font-size:52px;box-shadow:0 0 30px #7065ee40;animation:float 3s ease-in-out infinite}.creature.shiny{border-color:#ffe78a;box-shadow:0 0 25px #ffdc62}.creature.secret{border-color:#ed8dff;box-shadow:0 0 30px #ed8dff}@keyframes float{50%{transform:translateY(-6px)}}.mini{width:65px;height:65px;font-size:36px}.owned{text-align:center}.owned strong{display:block;margin-top:8px}.pill{display:inline-block;border-radius:100px;background:#314c83;padding:4px 10px;font-size:12px;margin:4px}.bar{height:15px;background:#0a1437;border-radius:20px;overflow:hidden;border:1px solid #54669e}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#41d78d,#a6ffb9);transition:width .2s}.mapWrap{overflow:hidden;border:2px solid #6472bc;border-radius:23px;height:57vh;min-height:380px;touch-action:none;position:relative;background:#192d54}.world{width:1800px;height:1080px;position:absolute;transform-origin:0 0;background:radial-gradient(ellipse at 13% 56%,#438b62 0,#204f49 18%,transparent 23%),radial-gradient(ellipse at 38% 38%,#357c68 0,#25464d 18%,transparent 24%),radial-gradient(ellipse at 58% 68%,#a5c3d0 0,#446c99 18%,transparent 25%),radial-gradient(ellipse at 78% 32%,#6750a9 0,#262459 19%,transparent 24%),radial-gradient(ellipse at 90% 77%,#613a82 0,#1b1b43 18%,transparent 24%),linear-gradient(145deg,#11385b,#151e4b);}.region{position:absolute;font-size:24px;text-shadow:0 2px 6px #000,0 0 8px #000;font-weight:900;white-space:nowrap;pointer-events:none}.node{position:absolute;border:2px solid #d4e6ff;border-radius:99px;background:#2b69aa;min-width:42px;height:42px;box-shadow:0 0 18px #83d4ff;display:grid;place-items:center;font-weight:900}.node.locked{background:#30334c;border-color:#6a708e;box-shadow:none;color:#a4a9ba}.node.done{background:#28765e;border-color:#a4ffb4}.node.boss{min-width:56px;height:56px;background:#85346e;border-color:#ffe08c;box-shadow:0 0 24px #fbd36f}.mapControls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.mapControls button{padding:9px 12px}.battleScene{background:radial-gradient(ellipse at center bottom,#327f79 0,#213e78 45%,#191738 95%);border:1px solid #727dd1;border-radius:25px;padding:16px;min-height:300px;position:relative;overflow:hidden}.battleActors{display:flex;justify-content:space-around;align-items:end;gap:20px;min-height:185px}.battleActors .creature{width:112px;height:112px;font-size:64px}.battleActors .enemy{filter:drop-shadow(0 0 12px #f263b0)}.health{margin:8px 0 16px}.attackButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attackButtons button{padding:13px 5px;font-size:13px}.log{min-height:40px;color:#e2d9ff;font-size:14px;margin:12px 0}.notice{border-radius:15px;border:1px solid #877dcc;background:#272759;padding:12px;margin:12px 0}.center{text-align:center}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.section{margin:18px 0}.levelCard{margin:10px 0;padding:13px;border:1px solid #6270b0;border-radius:14px;background:#222e59}.badge{font-size:11px;font-weight:800;color:#14152f;background:#f6d179;border-radius:15px;padding:3px 7px}.narrow{max-width:560px;margin:auto}input{background:#141b3c;border:1px solid #6d79af;color:#fff;border-radius:12px;padding:12px;width:100%;font:inherit}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);max-width:90%;background:#1c6d6a;border:1px solid #aaffeb;border-radius:15px;padding:12px;z-index:40;text-align:center}.hide{display:none!important}@media(min-width:700px){.features{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.battleScene.bossScene{background:radial-gradient(ellipse at center bottom,#713552,#32214f 50%,#170d30 95%);border:2px solid var(--gold);box-shadow:0 0 26px #ffbd4438}.bossScene .enemy{width:140px;height:140px;border-color:var(--gold);background:radial-gradient(circle,#944b86,#382049 72%);box-shadow:0 0 30px #ffca65a0}.wildScene .enemy{filter:none}.enemyInfo{margin:5px 0 8px}.enemyInfo .pill{margin-left:0}.enemyHealth{margin-bottom:6px;font-variant-numeric:tabular-nums}.bossCrown{position:absolute;margin-top:-28px;font-size:28px;left:50%;transform:translateX(-50%)}.battleActors>div{position:relative}.battleRewards{border-color:#bda96c}.battleActions{display:flex;flex-wrap:wrap;gap:10px}.node{font-size:12px;min-width:44px;padding:0 5px}.node.boss{font-size:12px}.node.boss.locked{background:#493549;box-shadow:none;border-color:#8b7c78}.node:focus-visible{outline:3px solid white;outline-offset:4px}@media(max-width:420px){.battleActors{gap:8px}.battleActors .creature{width:90px;height:90px;font-size:50px}.bossScene .enemy{width:110px;height:110px}.battleScene{padding:12px}.battleActors p{font-size:13px}}

</style></head><body><div id="app"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const species=[{name:'Flaminyx',emoji:'🦊',element:'Fire',power:19},{name:'Lunamo',emoji:'🦉',element:'Moon',power:17},{name:'Verdelle',emoji:'🦌',element:'Nature',power:16},{name:'Voltix',emoji:'🐉',element:'Lightning',power:20},{name:'Aquabub',emoji:'🐳',element:'Water',power:17},{name:'Crystella',emoji:'🦄',element:'Crystal',power:22},{name:'Frostbit',emoji:'🐺',element:'Ice',power:20},{name:'Umbryx',emoji:'🐈‍⬛',element:'Shadow',power:23},{name:'Emberoo',emoji:'🐇',element:'Fire',power:15},{name:'Zephyra',emoji:'🦋',element:'Wind',power:18}];const regions=[['Ember Meadows',1,10,260,630],['Crystalwood Forest',11,25,670,300],['Frozen Peaks',26,45,1050,700],['Thunder Valley',46,70,1420,310],['Shadow Realm',71,100,1610,810]];const bosses={10:'Magmarok',25:'Thorn Guardian',45:'Frostfang',70:'Voltitan',100:'Voidra'};const key='mythlings-playable-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.owned)){state={coins:400,level:1,cleared:[],owned:[{id:'starter',kind:0,level:1,xp:0,shiny:false}],team:'starter',map:{x:-95,y:-360,z:.72},packCount:0,achievements:[],training:{}}};const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};let view='home',context={},combat=null,toastTimer=0;const regionsFor=l=>regions.findIndex(x=>l>=x[1]&&l<=x[2]);const getCreature=()=>state.owned.find(x=>x.id===state.team)||state.owned[0];const meta=c=>species[c.kind];const reward=l=>bosses[l]?Math.min(3000,220+Math.floor(l*22)):Math.min(350,50+Math.floor(l*2.6));const limit=()=>Math.min(100,Math.max(1,...state.cleared.filter(x=>Number.isInteger(x)&&x>=1&&x<=100).map(x=>x+1)));
// Shared campaign encounter rules. Original species and save format are retained.
const enemyTraits=[
 {ability:'Ember Pounce',effect:'power',description:'A fierce pounce every third turn.',health:.95,attack:1.12},
 {ability:'Moon Veil',effect:'shield',description:'Raises a shield every third turn.',health:.96,attack:.95},
 {ability:'Grove Renewal',effect:'heal',description:'Recovers some health every third turn.',health:1.12,attack:.88},
 {ability:'Thunder Rush',effect:'power',description:'A charged lightning strike every third turn.',health:.9,attack:1.18},
 {ability:'Tidal Shell',effect:'shield',description:'Absorbs part of your next hit every third turn.',health:1.15,attack:.9},
 {ability:'Crystal Guard',effect:'shield',description:'Hardens its crystal armor every third turn.',health:1.2,attack:.86},
 {ability:'Frost Bite',effect:'drain',description:'An icy bite drains ultimate energy every third turn.',health:1.05,attack:1.02},
 {ability:'Shadow Siphon',effect:'drain',description:'Steals ultimate energy every third turn.',health:.96,attack:1.1},
 {ability:'Cinder Kick',effect:'power',description:'A quick, fiery kick every third turn.',health:.85,attack:1.08},
 {ability:'Breeze Mending',effect:'heal',description:'A healing breeze restores health every third turn.',health:.92,attack:.92}
];
const bossForms={10:{emoji:'🌋',element:'Fire',ability:'Volcanic Slam'},25:{emoji:'🌳',element:'Nature',ability:'Thornquake'},45:{emoji:'🐺',element:'Ice',ability:'Glacial Fang'},70:{emoji:'🐲',element:'Lightning',ability:'Stormbreaker'},100:{emoji:'👁️',element:'Shadow',ability:'Void Collapse'}};
function encounter(level){
 const boss=Object.hasOwn(bosses,level),kind=(level-1+regionsFor(level)*3)%species.length,s=species[kind],t=enemyTraits[kind],f=bossForms[level];
 return {level,boss,kind,name:boss?bosses[level]:s.name,emoji:boss?f.emoji:s.emoji,element:boss?f.element:s.element,ability:boss?f.ability:t.ability,effect:boss?'power':t.effect,description:boss?'A devastating signature strike every third turn. Dodge to avoid it!':t.description,maxhp:Math.round(boss?150+level*4:52+level*2.4+(t.health-1)*40),attack:Math.round(boss?10+level*.35:3+level*.24+(t.attack-1)*5),coins:reward(level),xp:boss?80+level*4:20+level*2};
}
function battleRewards(level){const e=encounter(level);return {coins:e.boss&&state.cleared.includes(level)?Math.round(e.coins*.45):e.coins,xp:e.xp}}


function toast(msg){clearTimeout(toastTimer);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=msg;el.classList.remove('hide');toastTimer=setTimeout(()=>el.classList.add('hide'),2800)}function head(){return `<header class="top"><div><div class="brand">✧ MYTHLINGS</div><div class="tag">MAGICAL ADVENTURE</div></div><div class="coins">🪙 ${state.coins}</div></header>`}function tabs(){return `<nav class="nav">${[['home','🏠','Home'],['packs','🎁','Packs'],['inventory','📚','Inventory'],['shop','🛍️','Shop']].map(([v,i,t])=>`<button data-go="${v}" class="${view===v?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('')}</nav>`}function frame(content){$('#app').innerHTML=head()+content+tabs();bind();save()}function card(go,icon,title,sub){return `<button class="tile" data-go="${go}"><span class="emoji">${icon}</span><strong>${title}</strong><span>${sub}</span></button>`}function home(){frame(`<section class="hero"><span class="pill">Explorer • Level ${limit()}</span><h1>Adventure HQ</h1><p>Explore an enormous magical world, win battles, earn coins, and discover incredible Mythlings!</p><button class="button gold" data-go="map">🗺️ Continue Adventure</button></section><div class="features">${card('map','🗺️','Adventure Map','100 battles across five regions')}${card('boss','🐲','Boss Arena','Solo bosses and epic rewards')}${card('training','🏟️','Training Field','Grow your Mythlings stronger')}${card('fusion','🔮','Fusion Lab','Two Mythlings, one surprise')}${card('trading','🤝','Friend Trading','Requires online accounts')} ${card('inventory','✨','My Team','Manage your battle partner')}</div><section class="panel"><h3>🏆 Your adventure</h3><p>${state.cleared.length} / 100 levels completed · ${state.owned.length} Mythlings collected</p><div class="bar"><i style="width:${state.cleared.length}%"></i></div><p class="muted small">Win battles for coins. Replay levels to collect more!</p></section>`)}function map(){
 const max=limit();let nodes='';
 for(let i=1;i<=100;i++){
  const p=positionLevel(i),en=encounter(i),done=state.cleared.includes(i),locked=i>max&&!done;
  nodes+=`<button class="node ${done?'done':''} ${locked?'locked':''} ${en.boss?'boss':''}" data-level="${i}" aria-label="Level ${i}: ${en.name}, ${en.boss?'boss':'normal battle'}${done?', completed, replay':locked?', locked':', ready'}" title="${en.name} · ${en.element} · ${en.maxhp} HP · ${en.coins} coins" style="left:${p.x}px;top:${p.y}px">${en.boss?'👑 ':done?'✓ ':''}${i}</button>`;
 }
 frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h2>🌍 World Map</h2><p class="muted small">Click any unlocked level to fight immediately. Drag empty space or pinch to explore. Completed levels stay replayable.</p><div class="mapWrap" id="mapWrap"><div class="world" id="world">${regions.map((r,i)=>`<div class="region" style="left:${r[3]-150}px;top:${r[4]-145}px">${['🌿','💎','❄️','⚡','🌌'][i]} ${r[0]}</div>`).join('')}${nodes}</div></div><div class="mapControls"><button class="button alt" data-map="in">＋ Zoom</button><button class="button alt" data-map="out">－ Zoom</button><button class="button" data-map="current">⌖ Current level (${max})</button></div><div class="muted small">🟢 Completed · 🔵 Ready · ⚫ Locked · 👑 Bosses: 10, 25, 45, 70, 100</div>`);setupMap();
}

function positionLevel(i){let r=regionsFor(i),n=i-regions[r][1];return {x:(r===0?80:r===1?495:r===2?845:r===3?1270:1510)+(n%5)*54+Math.floor(n/5)*16,y:(r===0?485:r===1?205:r===2?600:r===3?200:695)+(Math.sin(n*1.8)*85)+Math.floor(n/5)*34}}function setupMap(){
 const el=$('#mapWrap'),w=$('#world');if(!el)return;const m=state.map||{x:0,y:0,z:.7};
 function clamp(){m.z=Math.max(.4,Math.min(1.4,m.z));m.x=Math.min(80,Math.max(el.clientWidth-1800*m.z-80,m.x));m.y=Math.min(80,Math.max(el.clientHeight-1080*m.z-80,m.y));w.style.transform=`translate(${m.x}px,${m.y}px) scale(${m.z})`;state.map=m;save()}
 const pointers=new Map();let startDistance=0,startZoom=m.z,suppressClick=false;
 el.onpointerdown=e=>{
  if(e.button!==0)return;if(!pointers.size)suppressClick=false;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});
  // Capturing a button pointer on its parent swallows its native click. Only capture background drags.
  if(!e.target.closest('[data-level]'))el.setPointerCapture(e.pointerId);
  if(pointers.size===2){const a=[...pointers.values()];startDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startZoom=m.z;suppressClick=true}
 };
 el.onpointermove=e=>{
  const old=pointers.get(e.pointerId);if(!old)return;
  if(!suppressClick&&Math.hypot(e.clientX-old.startX,e.clientY-old.startY)<=7)return;
  suppressClick=true;pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()];m.z=startZoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,startDistance)}else{m.x+=e.clientX-old.x;m.y+=e.clientY-old.y}clamp();
 };
 const end=e=>{pointers.delete(e.pointerId);if(e.type==='pointercancel')suppressClick=true};
 el.onpointerup=el.onpointercancel=el.onlostpointercapture=end;
 el.onpointerleave=e=>{if(!el.hasPointerCapture(e.pointerId))end(e)};
 el.addEventListener('wheel',e=>{e.preventDefault();m.z+=e.deltaY>0?-.08:.08;clamp()},{passive:false});
 el.addEventListener('click',e=>{const node=e.target.closest('[data-level]');if(!node)return;if(suppressClick&&e.detail!==0){suppressClick=false;return}startBattle(Number(node.dataset.level))});
 document.querySelectorAll('[data-map]').forEach(x=>x.onclick=()=>{if(x.dataset.map==='in')m.z+=.15;else if(x.dataset.map==='out')m.z-=.15;else{const p=positionLevel(limit());m.x=el.clientWidth/2-(p.x+24)*m.z;m.y=el.clientHeight/2-(p.y+24)*m.z}clamp()});
 const p=positionLevel(limit());if(p.x*m.z+m.x<0||p.x*m.z+m.x>el.clientWidth-50||p.y*m.z+m.y<0||p.y*m.z+m.y>el.clientHeight-50){m.x=el.clientWidth/2-(p.x+24)*m.z;m.y=el.clientHeight/2-(p.y+24)*m.z}clamp();
}

function startBattle(level,bossOnly=false){
 if(!Number.isInteger(level)||level<1||level>100)return;
 if(level>limit()&&!state.cleared.includes(level)){toast('🔒 Beat the previous battles to unlock this level!');return}
 const c=getCreature(),enemy=encounter(level),hp=100+((c.level||1)-1)*7;
 combat={level,boss:enemy.boss,bossOnly,enemy,hp,maxhp:hp,enemyHP:enemy.maxhp,enemyMax:enemy.maxhp,energy:0,combo:0,turn:0,guard:false,enemyShield:false,log:'Choose an attack! Land combos to charge your ultimate.',done:false,result:null,rewards:battleRewards(level)};
 view='battle';scrollTo(0,0);renderBattle();
}
function renderBattle(){
 const b=combat;if(!b){home();return}const c=getCreature(),s=meta(c),en=b.enemy;
 const warning=(b.turn+1)%3===0,tip=warning?`⚠️ Next: ${en.ability} — dodge to avoid its effect!`:`Next: basic attack · ${en.ability} in ${3-b.turn%3} turns`;
 frame(`<button class="back" data-go="${b.bossOnly?'boss':'map'}">‹ Leave Battle</button><h2>${b.boss?'👑 Boss Fight':'⚔️ Normal Battle'} — Level ${b.level}</h2><div class="battleScene ${b.boss?'bossScene':'wildScene'}"><div class="flex"><strong>${en.name} · Lv.${en.level}</strong><span class="badge">${b.boss?'SOLO BOSS':'WILD MYTHLING'}</span></div><div class="enemyInfo"><span class="pill">${en.element}</span><span class="small muted">${en.ability}${b.enemyShield?' · 🛡️ Shield active':''}</span></div><div class="health"><div class="enemyHealth" id="enemy-health">Enemy HP: ${Math.max(0,b.enemyHP)} / ${b.enemyMax}</div><div class="bar" role="progressbar" aria-label="Enemy health" aria-valuemin="0" aria-valuemax="${b.enemyMax}" aria-valuenow="${Math.max(0,b.enemyHP)}"><i style="width:${Math.max(0,100*b.enemyHP/b.enemyMax)}%;background:linear-gradient(90deg,#f14d86,#ffb77d)"></i></div></div><div class="battleActors"><div><div class="creature ${c.shiny?'shiny':''} ${c.secret?'secret':''}">${s.emoji}</div><p class="center">${s.name} Lv.${c.level||1}</p></div><div>${b.boss?'<span class="bossCrown">👑</span>':''}<div class="creature enemy" role="img" aria-label="${en.name}, ${en.element} ${b.boss?'boss':'Mythling'}">${en.emoji}</div><p class="center">${en.name} Lv.${en.level}</p></div></div><div class="flex"><strong>❤️ HP ${Math.max(0,b.hp)} / ${b.maxhp}</strong><strong>⚡ Ultimate ${b.energy}%</strong></div><div class="bar"><i style="width:${Math.max(0,b.hp/b.maxhp*100)}%"></i></div></div><p class="muted small">${en.description}</p><div class="notice" role="status">🔥 Combo x${b.combo} · ${b.log}</div>${b.done?`<div class="battleActions">${b.result==='victory'&&b.level<100?`<button class="button gold" data-next="${b.level+1}">Fight Level ${b.level+1}</button>`:''}<button class="button" data-replay="${b.level}">${b.result==='victory'?'Replay Level':'Try Again'}</button><button class="button alt" data-go="map">Return to World Map</button></div>`:`<div class="notice small">${tip}</div><div class="attackButtons"><button class="button" data-attack="basic">⚔️ Attack</button><button class="button" data-attack="skill" ${b.energy<25?'disabled':''}>✨ Element Blast<br>25 energy</button><button class="button" data-attack="dodge">💨 Dodge</button><button class="button gold" style="grid-column:span 3" data-attack="ultimate" ${b.energy<100?'disabled':''}>🌟 ULTIMATE FINISHER · 100 energy</button></div><p class="muted small">Attack gains 24 energy. Dodge avoids this turn's attack and ability, and gains 45 energy.</p>`}<div class="notice battleRewards small">${b.boss?'👑 Boss rewards':'Victory rewards'}: 🪙 ${b.rewards.coins} coins · ✨ ${b.rewards.xp} XP${b.boss&&state.cleared.includes(b.level)&&b.result!=='victory'?' · Replay reward':''}</div>`);
 document.querySelectorAll('[data-attack]').forEach(x=>x.onclick=()=>attack(x.dataset.attack));
 document.querySelectorAll('[data-next],[data-replay]').forEach(x=>x.onclick=()=>startBattle(Number(x.dataset.next||x.dataset.replay),false));
}
function attack(action){
 const b=combat;if(!b||b.done||!['basic','skill','dodge','ultimate'].includes(action))return;
 if(action==='skill'&&b.energy<25||action==='ultimate'&&b.energy<100)return;
 const c=getCreature();
 if(action==='dodge'){b.guard=true;b.energy=Math.min(100,b.energy+25);b.log='Dodge stance!'}
 else{
  const base=meta(c).power+3*(c.level||1);
  let damage=Math.max(5,Math.round((action==='ultimate'?base*3.1+30:action==='skill'?base*1.7:base)*(.82+Math.random()*.36)));
  if(b.enemyShield){damage=Math.max(1,Math.round(damage*.6));b.enemyShield=false}
  if(action==='skill')b.energy-=25;else if(action==='ultimate')b.energy=0;else b.energy=Math.min(100,b.energy+24);
  b.enemyHP=Math.max(0,b.enemyHP-damage);b.combo++;b.log=`${action==='ultimate'?'🌟 ULTIMATE! ':''}${damage} damage! Combo x${b.combo}.`;
 }
 if(b.enemyHP<=0){win();return}
 b.turn++;
 const special=b.turn%3===0,en=b.enemy;
 let damage=special&&en.effect==='power'?Math.round(en.attack*(b.boss?1.8:1.5)):en.attack;
 if(b.guard){b.log+=` ✨ Dodged ${special?en.ability:'the attack'}! No damage taken.`;b.guard=false;b.energy=Math.min(100,b.energy+20)}
 else{
  b.hp=Math.max(0,b.hp-damage);b.log+=` ${en.name} dealt ${damage} damage.`;
  if(special){
   b.log+=` ${en.ability}!`;
   if(en.effect==='shield'){b.enemyShield=true;b.log+=' Next hit reduced by 40%.'}
   if(en.effect==='heal'){const heal=Math.min(b.enemyMax-b.enemyHP,Math.round(b.enemyMax*.08));b.enemyHP+=heal;b.log+=` Restored ${heal} HP.`}
   if(en.effect==='drain'){b.energy=Math.max(0,b.energy-15);b.log+=' Lost 15 ultimate energy.'}
  }
 }
 if(b.hp<=0){b.done=true;b.result='defeat';b.log='Defeat! No coins lost. Train your Mythling or try again.'}
 renderBattle();
}
function win(){
 const b=combat;if(!b||b.done)return;
 const c=getCreature(),r=b.rewards;
 b.done=true;b.result='victory';b.enemyHP=0;
 state.coins+=r.coins;if(!state.cleared.includes(b.level))state.cleared.push(b.level);
 c.xp=(c.xp||0)+r.xp;let leveled=false;
 while(c.xp>=c.level*60){c.xp-=c.level*60;c.level++;leveled=true}
 b.log=`🏆 Victory! +${r.coins} coins, +${r.xp} XP. ${leveled?'LEVEL UP!':''}`;
 save();renderBattle();toast('🏆 Victory! +'+r.coins+' coins');
}

function packs(){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h1>🎁 Mystery Packs</h1><p class="muted">Open magical packs to discover your own original Mythlings! Every pack contains one creature.</p><div class="grid"><section class="panel center"><div style="font-size:85px">🎁</div><h3>Wonder Pack</h3><p>One random Mythling<br><span class="muted small">10% shiny chance</span></p><strong>🪙 150 coins</strong><p><button class="button gold" data-buy="pack">Open Pack</button></p></section><section class="panel center"><div style="font-size:85px">💝</div><h3>Star Pack</h3><p>One random Mythling<br><span class="muted small">25% shiny chance · 5% secret glow</span></p><strong>🪙 350 coins</strong><p><button class="button gold" data-buy="star">Open Pack</button></p></section></div><p class="muted small">Opening results are random. Packs use battle-earned coins; no real money purchases.</p>`);document.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>openPack(x.dataset.buy))}function openPack(type){let cost=type==='star'?350:150;if(state.coins<cost){toast('Not enough coins! Win more battles.');return}if(!confirm('Open this pack for '+cost+' coins?'))return;state.coins-=cost;const kind=Math.floor(Math.random()*species.length),shiny=Math.random()<(type==='star'?.25:.10),secret=type==='star'&&Math.random()<.05;const c={id:String(Date.now())+Math.random().toString(16).slice(2),kind,level:1,xp:0,shiny,secret};state.owned.push(c);state.packCount++;save();view='reveal';frame(`<div class="hero center"><h1>✦ NEW MYTHLING! ✦</h1><div class="creature ${shiny?'shiny':''} ${secret?'secret':''}" style="width:170px;height:170px;font-size:94px;margin:20px auto">${meta(c).emoji}</div><h1>${meta(c).name}</h1><p>${meta(c).element} • ${secret?'🌌 SECRET ':''}${shiny?'✨ SHINY ':'💫'}Mythling</p><button class="button gold" data-go="inventory">Add to Inventory</button></div>`)}function inventory(){const selected=getCreature();frame(`<h1>📚 Inventory</h1><p class="muted">${state.owned.length} Mythlings collected. Tap a creature to make it your battle partner.</p><div class="grid">${state.owned.map(c=>`<button class="panel owned" data-team="${c.id}" style="border-color:${c.id===selected.id?'#ffdf72':'#53639d'}"><div class="creature mini ${c.shiny?'shiny':''} ${c.secret?'secret':''}">${meta(c).emoji}</div><strong>${meta(c).name}</strong><div class="small muted">Lv.${c.level} · ${meta(c).element}</div><span class="pill">${c.id===selected.id?'⭐ ACTIVE':c.shiny?'✨ Shiny':'Select'}</span>${c.secret?'<span class="pill">SECRET</span>':''}</button>`).join('')}</div>`);document.querySelectorAll('[data-team]').forEach(x=>x.onclick=()=>{state.team=x.dataset.team;save();inventory();toast('New active Mythling selected!')})}function shop(){frame(`<h1>🛍️ Mythlings Shop</h1><p class="muted">Use coins you earn from battles, not real money.</p><div class="panel center"><div style="font-size:70px">🎁</div><h2>Magical Packs</h2><p>New creatures are waiting to be discovered.</p><button class="button gold" data-go="packs">Browse Packs</button></div><div class="panel section"><h3>✨ Training boosts</h3><p class="muted">Spend battle-earned coins to boost your active Mythling's XP.</p><button class="button" data-buy="boost">Buy +50 XP • 🪙 100</button></div>`);$('[data-buy="boost"]').onclick=()=>{if(state.coins<100)return toast('Earn 100 coins in battles first!');if(!confirm('Spend 100 coins on +50 XP?'))return;state.coins-=100;let c=getCreature();c.xp+=50;while(c.xp>=c.level*60){c.xp-=c.level*60;c.level++}save();shop();toast('✨ Your Mythling grew stronger!')}}function training(){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><div class="hero"><h1>🏟️ Training Field</h1><p>Train your active Mythling through mini-games. Battle victories remain your main way to earn coins.</p><p>Training ${meta(getCreature()).name} — Level ${getCreature().level}</p></div><div class="features">${[['yard','🎯','Training Yard','Tap the target for XP'],['dojo','🥋','Skill Dojo','Practice perfect timing'],['element','💎','Element Chamber','Element mastery'],['obstacle','🏃','Obstacle Run','Speed and dodge practice'],['tower','🗼','Power Tower','Advanced challenge'],['spar','⚔️','Sparring Arena','Battle practice'],['camp','🏕️','Rest Camp','Rest and bond']].map(x=>card('train-'+x[0],x[1],x[2],x[3])).join('')}</div>`)}function trainMini(name){const names={yard:'Training Yard',dojo:'Skill Dojo',element:'Element Chamber',obstacle:'Obstacle Run',tower:'Power Tower',spar:'Sparring Arena',camp:'Rest Camp'};let count=0,target=5;frame(`<button class="back" data-go="training">‹ Training Field</button><section class="panel center"><h1>${names[name]||'Training'}</h1><div class="creature" style="width:140px;height:140px;font-size:85px">${meta(getCreature()).emoji}</div><h2 id="trainingCount">0 / ${target} practices</h2><p>Complete five actions to earn +25 XP for your active Mythling.</p><button id="practice" class="button gold">✨ Practice!</button></section><p class="muted small">Training awards XP only, never coins. Repeat to grow stronger.</p>`);$('#practice').onclick=()=>{count++;$('#trainingCount').textContent=`${Math.min(count,5)} / ${target} practices`;if(count>=target){let c=getCreature();c.xp+=25;while(c.xp>=c.level*60){c.xp-=c.level*60;c.level++}save();$('#practice').disabled=true;$('#practice').textContent='✅ Training completed';toast('✨ +25 training XP earned!')}}}function boss(){const unlocked=[10,25,45,70,100].filter(x=>x<=limit());frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h1>👑 Boss Arena</h1><p class="muted">Fight legendary solo bosses and unlock new regions.</p>${[10,25,45,70,100].map(x=>`<section class="levelCard flex"><div><strong>${bosses[x]}</strong><p class="small muted">Level ${x} · 🪙 ${reward(x)} first-win coins</p></div><button class="button" data-boss="${x}" ${!unlocked.includes(x)?'disabled':''}>${unlocked.includes(x)?'Fight':'🔒 Locked'}</button></section>`).join('')}`);document.querySelectorAll('[data-boss]').forEach(x=>x.onclick=()=>startBattle(+x.dataset.boss,true))}function fusion(){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h1>🔮 Fusion Lab</h1><p>Combine two Mythlings into one surprise Mythling. Both originals will be consumed.</p><div class="panel center"><div style="font-size:70px">🔮</div><p>You own ${state.owned.length} Mythlings. Fusion requires at least 3, keeping one to battle with.</p><button class="button gold" id="fuse" ${state.owned.length<3?'disabled':''}>Fuse 2 Mythlings • 🪙 200</button><p class="muted small">Surprise result: 15% shiny, 85% normal. Your current active Mythling is protected.</p></div>`);$('#fuse').onclick=()=>{if(state.coins<200)return toast('Not enough coins');if(state.owned.length<3)return;if(!confirm('Spend 200 coins and consume two non-active Mythlings for a surprise creature?'))return;const candidates=state.owned.filter(x=>x.id!==state.team),items=candidates.slice(0,2);if(items.length<2)return toast('You need two spare Mythlings');state.owned=state.owned.filter(x=>!items.some(z=>z.id===x.id));state.coins-=200;let c={id:String(Date.now()),kind:Math.floor(Math.random()*species.length),level:1,xp:0,shiny:Math.random()<.15};state.owned.push(c);save();toast('🔮 Fusion created '+meta(c).name+'!');inventory()}}function trading(){frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h1>🤝 Friend Trading</h1><section class="panel"><h2>Coming with online accounts</h2><p>Secure friends-only trading needs user accounts and a connected server so neither player can lose creatures or duplicate trades.</p><p class="muted">This prototype does not pretend a trade happened. You can already collect, battle, train and fuse your Mythlings.</p></section>`)}function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}function go(v){view=v;scrollTo(0,0);if(v==='home')home();else if(v==='map')map();else if(v==='battle')renderBattle();else if(v==='packs')packs();else if(v==='inventory')inventory();else if(v==='shop')shop();else if(v==='training')training();else if(v.startsWith('train-'))trainMini(v.slice(6));else if(v==='boss')boss();else if(v==='fusion')fusion();else if(v==='trading')trading();else home()}window.addEventListener('pagehide',save);go('home');})();
</script></body></html>
