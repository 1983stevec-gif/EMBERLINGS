x;height:108px}.joystickKnob{left:28px;top:28px}.joystick:before{left:45px}.joystick:after{top:43px;left:3px;font-size:16px}.arenaControls{gap:10px}.arenaButtons .button{font-size:11px;padding:9px 5px;min-height:49px}.arenaHud{font-size:11px;padding:7px}.arenaHint{font-size:11px}#app:has(.arenaCanvas){padding-bottom:85px}}@media(orientation:landscape) and (max-height:600px){.arenaCanvas{max-height:51vh;object-fit:contain}.arenaControls{margin:5px 0}.arenaHint{margin:2px 0}}

(()=>{'use strict';const $=s=>document.querySelector(s);const species=[{name:'Flaminyx',emoji:'🦊',element:'Fire',power:19},{name:'Lunamo',emoji:'🦉',element:'Moon',power:17},{name:'Verdelle',emoji:'🦌',element:'Nature',power:16},{name:'Voltix',emoji:'🐉',element:'Lightning',power:20},{name:'Aquabub',emoji:'🐳',element:'Water',power:17},{name:'Crystella',emoji:'🦄',element:'Crystal',power:22},{name:'Frostbit',emoji:'🐺',element:'Ice',power:20},{name:'Umbryx',emoji:'🐈‍⬛',element:'Shadow',power:23},{name:'Emberoo',emoji:'🐇',element:'Fire',power:15},{name:'Zephyra',emoji:'🦋',element:'Wind',power:18}];const regions=[['Ember Meadows',1,10,260,630],['Crystalwood Forest',11,25,670,300],['Frozen Peaks',26,45,1050,700],['Thunder Valley',46,70,1420,310],['Shadow Realm',71,100,1610,810]];const bosses={10:'Magmarok',25:'Thorn Guardian',45:'Frostfang',70:'Voltitan',100:'Voidra'};const key='mythlings-playable-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.owned)){state={coins:400,level:1,cleared:[],owned:[{id:'starter',kind:0,level:1,xp:0,shiny:false}],team:'starter',map:{x:-95,y:-360,z:.72},packCount:0,achievements:[],training:{}}};const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};let view='home',context={},combat=null,toastTimer=0;const regionsFor=l=>regions.findIndex(x=>l>=x[1]&&l<=x[2]);const getCreature=()=>state.owned.find(x=>x.id===state.team)||state.owned[0];const meta=c=>species[c.kind];const reward=l=>bosses[l]?Math.min(3000,220+Math.floor(l*22)):Math.min(350,50+Math.floor(l*2.6));const limit=()=>Math.min(100,Math.max(1,...state.cleared.filter(x=>Number.isInteger(x)&&x>=1&&x<=100).map(x=>x+1)));
// Shared campaign encounter rules. Original species and save format are retained.
const enemyTraits=[
 {ability:'Ember Pounce',effect:'power',description:'A fierce pounce every third turn.',health:.95,attack:1.12},
 {ability:'Moon Veil',effect:'shield',description:'Raises a shield every third turn.',health:.96,attack:.95},
 {ability:'Grove Renewal',effect:'heal',description:'Recovers some health every third turn.',health:1.12,attack:.88},
 {ability:'Thunder Rush',effect:'power',description:'A charged lightning strike every third turn.',health:.9,attack:1.18},
 {ability:'Tidal Shell',effect:'shield',description:'Absorbs part of your next hit every third turn.',health:1.15,attack:.9},
 {ability:'Crystal Guard',effect:'shield',description:'Hardens its crystal armor every third turn.',health:1.2,attack:.86},
 {ability:'Frost Bite',effect:'drain',description:'An icy bite drains ultimate energy every third turn.',health:1.05,attack:1.02},
 {ability:'Shadow Siphon',effect:'drain',description:'Steals ultimate energy every third turn.',health:.96,attack:1.1},
 {ability:'Cinder Kick',effect:'power',description:'A quick, fiery kick every third turn.',health:.85,attack:1.08},
 {ability:'Breeze Mending',effect:'heal',description:'A healing breeze restores health every third turn.',health:.92,attack:.92}
];
const bossForms={10:{emoji:'🌋',element:'Fire',ability:'Volcanic Slam'},25:{emoji:'🌳',element:'Nature',ability:'Thornquake'},45:{emoji:'🐺',element:'Ice',ability:'Glacial Fang'},70:{emoji:'🐲',element:'Lightning',ability:'Stormbreaker'},100:{emoji:'👁️',element:'Shadow',ability:'Void Collapse'}};
function encounter(level){
 const boss=Object.hasOwn(bosses,level),kind=(level-1+regionsFor(level)*3)%species.length,s=species[kind],t=enemyTraits[kind],f=bossForms[level];
 return {level,boss,kind,name:boss?bosses[level]:s.name,emoji:boss?f.emoji:s.emoji,element:boss?f.element:s.element,ability:boss?f.ability:t.ability,effect:boss?'power':t.effect,description:boss?'A devastating signature strike every third turn. Dodge to avoid it!':t.description,maxhp:Math.round(boss?150+level*4:52+level*2.4+(t.health-1)*40),attack:Math.round(boss?10+level*.35:3+level*.24+(t.attack-1)*5),coins:reward(level),xp:boss?80+level*4:20+level*2};
}
function battleRewards(level){const e=encounter(level);return {coins:e.boss&&state.cleared.includes(level)?Math.round(e.coins*.45):e.coins,xp:e.xp}}


function toast(msg){clearTimeout(toastTimer);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=msg;el.classList.remove('hide');toastTimer=setTimeout(()=>el.classList.add('hide'),2800)}function head(){return `<header class="top"><div><div class="brand">✧ MYTHLINGS</div><div class="tag">MAGICAL ADVENTURE</div></div><div class="coins">🪙 ${state.coins}</div></header>`}function tabs(){return `<nav class="nav">${[['home','🏠','Home'],['packs','🎁','Packs'],['inventory','📚','Inventory'],['shop','🛍️','Shop']].map(([v,i,t])=>`<button data-go="${v}" class="${view===v?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('')}</nav>`}function frame(content){$('#app').innerHTML=head()+content+tabs();bind();save()}function card(go,icon,title,sub){return `<button class="tile" data-go="${go}"><span class="emoji">${icon}</span><strong>${title}</strong><span>${sub}</span></button>`}function home(){frame(`<section class="hero"><span class="pill">Explorer • Level ${limit()}</span><h1>Adventure HQ</h1><p>Explore an enormous magical world, win battles, earn coins, and discover incredible Mythlings!</p><button class="button gold" data-go="map">🗺️ Continue Adventure</button></section><div class="features">${card('map','🗺️','Adventure Map','100 battles across five regions')}${card('boss','🐲','Boss Arena','Solo bosses and epic rewards')}${card('training','🏟️','Training Field','Grow your Mythlings stronger')}${card('fusion','🔮','Fusion Lab','Two Mythlings, one surprise')}${card('trading','🤝','Friend Trading','Requires online accounts')} ${card('inventory','✨','My Team','Manage your battle partner')}</div><section class="panel"><h3>🏆 Your adventure</h3><p>${state.cleared.length} / 100 levels completed · ${state.owned.length} Mythlings collected</p><div class="bar"><i style="width:${state.cleared.length}%"></i></div><p class="muted small">Win battles for coins. Replay levels to collect more!</p></section>`)}function map(){
 const max=limit();let nodes='';
 for(let i=1;i<=100;i++){
  const p=positionLevel(i),en=encounter(i),done=state.cleared.includes(i),locked=i>max&&!done;
  nodes+=`<button class="node ${done?'done':''} ${locked?'locked':''} ${en.boss?'boss':''}" data-level="${i}" aria-label="Level ${i}: ${en.name}, ${en.boss?'boss':'normal battle'}${done?', completed, replay':locked?', locked':', ready'}" title="${en.name} · ${en.element} · ${en.maxhp} HP · ${en.coins} coins" style="left:${p.x}px;top:${p.y}px">${en.boss?'👑 ':done?'✓ ':''}${i}</button>`;
 }
 frame(`<button class="back" data-go="home">‹ Adventure HQ</button><h2>🌍 World Map</h2><p class="muted small">Click any unlocked level to fight immediately. Drag empty space or pinch to explore. Completed levels stay replayable.</p><div class="mapWrap" id="mapWrap"><div class="world" id="world">${regions.map((r,i)=>`<div class="region" style="left:${r[3]-150}px;top:${r[4]-145}px">${['🌿','💎','❄️','⚡','🌌'][i]} ${r[0]}</div>`).join('')}${nodes}</div></div><div class="mapControls"><button class="button alt" data-map="in">＋ Zoom</button><button class="button alt" data-map="out">－ Zoom</button><button class="button" data-map="current">⌖ Current level (${max})</button></div><div class="muted small">🟢 Completed · 🔵 Ready · ⚫ Locked · 👑 Bosses: 10, 25, 45, 70, 100</div>`);setupMap();
}

function positionLevel(i){let r=regionsFor(i),n=i-regions[r][1];return {x:(r===0?80:r===1?495:r===2?845:r===3?1270:1510)+(n%5)*54+Math.floor(n/5)*16,y:(r===0?485:r===1?205:r===2?600:r===3?200:695)+(Math.sin(n*1.8)*85)+Math.floor(n/5)*34}}function setupMap(){
 const el=$('#mapWrap'),w=$('#world');if(!el)return;const m=state.map||{x:0,y:0,z:.7};
 function clamp(){m.z=Math.max(.4,Math.min(1.4,m.z));m.x=Math.min(80,Math.max(el.clientWidth-1800*m.z-80,m.x));m.y=Math.min(80,Math.max(el.clientHeight-1080*m.z-80,m.y));w.style.transform=`translate(${m.x}px,${m.y}px) scale(${m.z})`;state.map=m;save()}
 const pointers=new Map();let startDistance=0,startZoom=m.z,suppressClick=false;
 el.onpointerdown=e=>{
  if(e.button!==0)return;if(!pointers.size)suppressClick=false;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});
  // Capturing a button pointer on its parent swallows its native click. Only capture background drags.
  if(!e.target.closest('[data-level]'))el.setPointerCapture(e.pointerId);
  if(pointers.size===2){const a=[...pointers.values()];startDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startZoom=m.z;suppressClick=true}
 };
 el.onpointermove=e=>{
  const old=pointers.get(e.pointerId);if(!old)return;
  if(!suppressClick&&Math.hypot(e.clientX-old.startX,e.clientY-old.startY)<=7)return;
  suppressClick=true;pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});
  if(pointers.size===2){const a=[...pointers.values()];m.z=startZoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,startDistance)}else{m.x+=e.clientX-old.x;m.y+=e.clientY-old.y}clamp();
 };
 const end=e=>{pointers.delete(e.pointerId);if(e.type==='pointercancel')suppressClick=true};
 el.onpointerup=el.onpointercancel=el.onlostpointercapture=end;
 el.onpointerleave=e=>{if(!el.hasPointerCapture(e.pointerId))end(e)};
 el.addEventListener('wheel',e=>{e.preventDefault();m.z+=e.deltaY>0?-.08:.08;clamp()},{passive:false});
